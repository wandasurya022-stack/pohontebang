<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Menebang Pohon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game">
        <h1>🌳 Game Menebang Pohon</h1>

        <div id="tree">🌳</div>

        <div class="bar">
            <div id="hp"></div>
        </div>

        <p>HP Pohon: <span id="hpText">100</span>/100</p>
        <p>Kayu: <span id="wood">0</span></p>

        <button onclick="chopTree()">🪓 Tebang Pohon</button>
    </div>

<script src="script.js"></script>
</body>
</html>
